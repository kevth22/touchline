    'Ellyes Skhiri':[80,80], 'Thijs Dallinga':[79,82], 'Saïd El Mala':[77,89], 'Mikey Moore':[76,90],
    'Emmanuel Latte Lath':[78,81], 'Tom Rothe':[77,85], 'Aljoscha Kemlein':[76,84],
    'Maurice Krattenmacher':[75,86], 'Noah Darvich':[74,87], 'Cole Campbell':[73,86],
    'Gabriel Vidović':[76,84], 'Laurin Ulrich':[74,85], 'Marvin Pieringer':[76,79]
  };

  const posBase = {TW:0,ABW:0,MF:0,ST:0};
  const hash = s => [...s].reduce((a,c)=>((a*31+c.charCodeAt(0))>>>0),7);
  const players=[];
  let pid=1;
  for(const club of clubs){
    const s=squads[club.id];
    for(const [pos,names] of Object.entries(s)){
      names.forEach((name,idx)=>{
        const h=hash(name);
        const noise=(h%7)-3;
        let rating=Math.max(64,Math.min(90,club.strength-2+noise));
        let potential=Math.min(94,rating + (h%5));
        if(starRatings[name]) [rating,potential]=starRatings[name];
        const age=18+(h%18);
        if(age<=21) potential=Math.max(potential,Math.min(92,rating+5+(h%4)));
        const value=Math.round((Math.pow(Math.max(1,rating-60),2)*65000) * (potential>rating?1.15:1));
        const wage=Math.round((club.wageBudget/Math.max(22,Object.values(s).flat().length))*(0.72+(rating-club.strength+8)/20));
        const contractYears=1+(h%5);
        players.push({id:'p'+pid++,name,clubId:club.id,position:pos,shirt:idx+1,rating,potential,age,value,wage,contractYears,form:70+(h%21),morale:72+(h%19)});
      });
    }
  }

  const leagues = {
    'Deutschland · Bundesliga': clubs.map(c=>c.id),
    'Deutschland · 2. Bundesliga': ['VfL Wolfsburg','FC St. Pauli','1. FC Heidenheim 1846','Hertha BSC','1. FC Nürnberg','1. FC Kaiserslautern','1. FC Magdeburg','VfL Bochum 1848','Hannover 96','VfL Osnabrück','SpVgg Greuther Fürth','Karlsruher SC','Eintracht Braunschweig','DSC Arminia Bielefeld','Holstein Kiel','SG Dynamo Dresden','SV Darmstadt 98','FC Energie Cottbus'],
    'England · Premier League': [], 'England · Championship': [], 'Spanien · La Liga': [], 'Spanien · Segunda División': [], 'Italien · Serie A': [], 'Italien · Serie B': [], 'Frankreich · Ligue 1': [], 'Frankreich · Ligue 2': []
  };

  return {clubs,players,leagues,meta:{season:'2026/27',ratingModel:'Touchline Eigenbewertung; keine EA-/FM-Werte',updated:'2026-10-06'}};
})();

</script>
<script>
const DB=window.TOUCHLINE_DB;
const SAVE_KEY='touchline_v3_2026_27';
const fmtE=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
const clone=o=>JSON.parse(JSON.stringify(o));
let state=load();
let view='dashboard';
let modal=null;

function initialState(){return {career:false,clubId:'s04',role:'sportdirektor',date:'2026-07-01',clubs:clone(DB.clubs),players:clone(DB.players),transfers:[],inbox:[],history:[]}}
function load(){try{return {...initialState(),...JSON.parse(localStorage.getItem(SAVE_KEY)||'{}')}}catch{return initialState()}}
function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(state))}
function club(id){return state.clubs.find(c=>c.id===id)}
function myClub(){return club(state.clubId)}
function squad(id=state.clubId){return state.players.filter(p=>p.clubId===id).sort((a,b)=>b.rating-a.rating)}
function avgStrength(id){let s=squad(id).slice(0,18);return s.length?Math.round(s.reduce((a,p)=>a+p.rating,0)/s.length):club(id)?.strength||70}
function nav(){return [['dashboard','Übersicht'],['squad','Kader'],['transfers','Transfers'],['negotiations','Verhandlungen'],['finances','Finanzen'],['stadium','Stadion'],['staff','Mitarbeiter'],['league','Vereinsvergleich'],['sources','Datenstand']]}

function app(){
 const root=document.getElementById('app');
 if(!state.career){root.innerHTML=setupHtml();wireSetup();return}
 const c=myClub();
 root.innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand">TOUCH<span>LINE</span></div><div class="season">Vereinsführung · Saison 2026/27</div><div class="nav">${nav().map(([id,n])=>`<button data-view="${id}" class="${view===id?'active':''}">${n}</button>`).join('')}</div><div class="source" style="margin-top:28px">${c.name}<br>${c.stadium}<br><br><button class="button secondary" id="newCareer">Neue Karriere</button></div></aside><main class="main"><div class="topbar"><div class="clubline"><strong>${c.name}</strong><div>${c.stadium} · Stärke ${avgStrength(c.id)} · Reputation ${c.reputation}</div></div><select class="role" id="roleSelect"><option value="vereinschef">Vereinschef</option><option value="sportdirektor">Sportdirektor</option><option value="trainer">Trainer</option></select></div>${renderView()}</main></div>${renderModal()}`;
 document.getElementById('roleSelect').value=state.role;
 document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;modal=null;app()});
 document.getElementById('roleSelect').onchange=e=>{state.role=e.target.value;save();app()};
 document.getElementById('newCareer').onclick=()=>{if(confirm('Aktuelle Karriere wirklich zurücksetzen?')){localStorage.removeItem(SAVE_KEY);state=initialState();view='dashboard';app()}};
 wireView();
}

function setupHtml(){return `<div class="setup"><div class="hero"><div class="label">TOUCHLINE VEREINSFÜHRUNG</div><h1>Dein Verein. Deine Entscheidungen.</h1><p>Neuer Datenbankkern für 2026/27 mit realen Bundesliga-Kadern, Vereinsstärken, Stadionökonomie und echten Transferverhandlungen.</p></div><div class="card form"><h2>Karriere starten</h2><div class="formgrid"><div><label>Land & Liga</label><select id="league"><option>Deutschland · Bundesliga</option><option>Deutschland · 2. Bundesliga</option><option>England · Premier League</option><option>England · Championship</option><option>Spanien · La Liga</option><option>Spanien · Segunda División</option><option>Italien · Serie A</option><option>Italien · Serie B</option><option>Frankreich · Ligue 1</option><option>Frankreich · Ligue 2</option></select></div><div><label>Verein</label><select id="club"></select></div><div><label>Deine Rolle</label><select id="role"><option value="vereinschef">Vereinschef</option><option value="sportdirektor" selected>Sportdirektor</option><option value="trainer">Trainer</option></select></div></div><p class="notice">In dieser Version ist <b>Deutschland · Bundesliga</b> vollständig mit realen 2026/27-Spielern spielbar. Die übrigen Ligawelten bleiben im Menü, werden aber erst nach dem gleichen Datenstandard freigeschaltet.</p><button class="button" id="start">Karriere starten</button></div></div>`}
function wireSetup(){
 const league=document.getElementById('league'), sel=document.getElementById('club');
 function fill(){const l=league.value;if(l==='Deutschland · Bundesliga'){sel.disabled=false;sel.innerHTML=DB.clubs.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}else{sel.disabled=true;sel.innerHTML='<option>Noch nicht auf vollständigem Datenstandard</option>'}}
 league.onchange=fill;fill();document.getElementById('start').onclick=()=>{if(league.value!=='Deutschland · Bundesliga'){alert('Diese Liga ist noch nicht vollständig mit realen 2026/27-Kadern hinterlegt. Bitte Bundesliga wählen.');return}state=initialState();state.career=true;state.clubId=sel.value;state.role=document.getElementById('role').value;save();app()}
}

function renderView(){switch(view){case'squad':return squadHtml();case'transfers':return transfersHtml();case'negotiations':return negotiationsHtml();case'finances':return financesHtml();case'stadium':return stadiumHtml();case'staff':return staffHtml();case'league':return leagueHtml();case'sources':return sourcesHtml();default:return dashboardHtml()}}
function dashboardHtml(){const c=myClub(),s=squad();let avg=avgStrength(c.id),potential=Math.round(s.slice(0,18).reduce((a,p)=>a+p.potential,0)/Math.max(1,s.slice(0,18).length));return `<div class="hero"><div class="label">Saison 2026/27 · ${state.role}</div><h1>${c.short}</h1><p>Die Vereinsstärke basiert jetzt auf dem tatsächlichen Kaderniveau. Transfers verändern deine Mannschaftsstärke sofort.</p></div><div class="grid"><div class="card kpi"><div class="label">Kaderstärke</div><div class="value">${avg}</div><div class="small">Top-18 Durchschnitt</div></div><div class="card kpi"><div class="label">Potenzial</div><div class="value">${potential}</div><div class="small">Top-18 Potenzial</div></div><div class="card kpi"><div class="label">Transferbudget</div><div class="value">${fmtE(c.transferBudget)}</div></div><div class="card kpi"><div class="label">Stadion</div><div class="value">${c.capacity.toLocaleString('de-DE')}</div><div class="small">${c.stadium}</div></div><div class="card wide"><h2>Stärkste Spieler</h2>${playerTable(s.slice(0,8),false)}</div><div class="card side"><h2>Führung</h2><p><span class="label">Trainer</span><br><b>${c.coach}</b></p><p><span class="label">Sportdirektor</span><br><b>${c.sportingDirector}</b></p><p><span class="label">Sport-Geschäftsführung</span><br><b>${c.board}</b></p><div class="notice">Bayern liegt als Kader deutlich über Augsburg/Elversberg/Paderborn; diese Unterschiede fließen in Transferforderungen und Simulation ein.</div></div></div>`}
function playerTable(players,action=true){return `<div class="tablewrap"><table><thead><tr><th>Spieler</th><th>Pos.</th><th>Alter*</th><th>Stärke</th><th>Potenzial</th><th>Marktwert</th><th>Gehalt/W.</th>${action?'<th></th>':''}</tr></thead><tbody>${players.map(p=>`<tr><td><b>${p.name}</b></td><td><span class="pill">${p.position}</span></td><td>${p.age}</td><td class="rating ${p.rating>=86?'high':''}">${p.rating}</td><td class="rating">${p.potential}</td><td>${fmtE(p.value)}</td><td>${fmtE(p.wage)}</td>${action?`<td><button class="button secondary negotiate" data-p="${p.id}">Verhandeln</button></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function squadHtml(){let s=squad();return `<div class="card full"><h1>Kader ${myClub().name}</h1><p class="small">Aktuelle 2026/27-Kadernamen. Stärke und Potenzial sind Touchline-Eigenbewertungen und keine kopierten EA-/Football-Manager-Werte.</p>${playerTable(s,false)}</div>`}
function transfersHtml(){const others=state.players.filter(p=>p.clubId!==state.clubId).sort((a,b)=>b.rating-a.rating);return `<div class="card full"><h1>Transfermarkt</h1><div class="toolbar"><input id="search" placeholder="Spieler suchen…"><select id="minRating"><option value="0">Alle Stärken</option><option value="80">80+</option><option value="85">85+</option><option value="88">88+</option></select><select id="pos"><option value="">Alle Positionen</option><option>TW</option><option>ABW</option><option>MF</option><option>ST</option></select></div><div id="transferTable">${playerTable(others.slice(0,120),true)}</div></div>`}
function negotiationsHtml(){const ts=state.transfers.slice().reverse();return `<div class="card full"><h1>Verhandlungen</h1>${ts.length?`<div class="tablewrap"><table><thead><tr><th>Spieler</th><th>Verein</th><th>Status</th><th>Ablöse</th><th>Gehalt</th><th></th></tr></thead><tbody>${ts.map(t=>{const p=state.players.find(x=>x.id===t.playerId);return `<tr><td><b>${p?.name||t.playerName}</b></td><td>${club(t.fromClubId)?.short||'-'}</td><td><span class="pill">${t.status}</span></td><td>${fmtE(t.fee||0)}</td><td>${fmtE(t.wage||0)}</td><td>${t.status==='Verein akzeptiert'?`<button class="button playerTalk" data-t="${t.id}">Spieler verhandeln</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="notice">Noch keine Verhandlungen gestartet.</div>'}</div>`}
function financesHtml(){const c=myClub(),weekly=squad().reduce((a,p)=>a+p.wage,0),annual=weekly*52;return `<div class="grid"><div class="card kpi"><div class="label">Transferbudget</div><div class="value">${fmtE(c.transferBudget)}</div></div><div class="card kpi"><div class="label">Gehaltsbudget/Woche</div><div class="value">${fmtE(c.wageBudget)}</div></div><div class="card kpi"><div class="label">Aktuelle Gehälter/Woche</div><div class="value ${weekly>c.wageBudget?'bad':'good'}">${fmtE(weekly)}</div></div><div class="card kpi"><div class="label">Jährliche Kadergehälter</div><div class="value">${fmtE(annual)}</div></div><div class="card full"><h2>Budgetlogik</h2><p>Das Transferbudget ist ein <b>realistischer Spielwert</b>, kein behaupteter offizieller Vereinswert. Es skaliert mit Vereinsgröße, Reputation, Kaderstärke und wirtschaftlichem Niveau. Transfers ziehen Ablöse sowie Handgeld ab; Gehälter belasten das Wochenbudget.</p></div></div>`}
function stadiumHtml(){const c=myClub(),attendance=Math.round(c.capacity*(.62+c.reputation/300)),matchRevenue=attendance*c.ticketPrice;return `<div class="grid"><div class="card wide"><h1>${c.stadium}</h1><p><b>${c.capacity.toLocaleString('de-DE')}</b> Plätze</p><div class="form"><label>Durchschnittlicher Ticketpreis (Spielmodell)</label><input id="ticket" type="number" min="10" max="200" value="${c.ticketPrice}"></div><p class="notice">Erwartete Auslastung: <b>${attendance.toLocaleString('de-DE')}</b> · Ticketeinnahmen pro Heimspiel: <b>${fmtE(matchRevenue)}</b></p><button class="button" id="saveTicket">Preis speichern</button></div><div class="card side"><h2>Stadioneffekt</h2><p>Kapazität, Reputation und Ticketpreis bestimmen die Heimspiel-Einnahmen. Ein großer Verein mit hoher Nachfrage kann höhere Preise verlangen; zu hohe Preise drücken in späteren Versionen die Auslastung.</p></div></div>`}
function staffHtml(){const c=myClub();const staff=[['Cheftrainer',c.coach,78+Math.round(c.strength/8),'Taktik / Entwicklung'],['Sportdirektor',c.sportingDirector,76+Math.round(c.reputation/9),'Transfers / Netzwerk'],['Sport-Geschäftsführung',c.board,75+Math.round(c.reputation/10),'Budget / Strategie']];return `<div class="card full"><h1>Mitarbeiter</h1><div class="tablewrap"><table><thead><tr><th>Rolle</th><th>Name</th><th>Gesamt</th><th>Profil</th></tr></thead><tbody>${staff.map(x=>`<tr><td>${x[0]}</td><td><b>${x[1]}</b></td><td class="rating">${x[2]}</td><td>${x[3]}</td></tr>`).join('')}</tbody></table></div><p class="small">Mitarbeiterstärken sind Touchline-Spielwerte; die Namen/Funktionen basieren auf dem aktuellen Vereinsstand.</p></div>`}
function leagueHtml(){const cs=state.clubs.slice().sort((a,b)=>avgStrength(b.id)-avgStrength(a.id));return `<div class="card full"><h1>Bundesliga-Vereinsvergleich 2026/27</h1><div class="tablewrap"><table><thead><tr><th>#</th><th>Verein</th><th>Kaderstärke</th><th>Reputation</th><th>Transferbudget</th><th>Stadion</th><th>Kapazität</th></tr></thead><tbody>${cs.map((c,i)=>`<tr><td>${i+1}</td><td><b>${c.name}</b></td><td class="rating ${avgStrength(c.id)>=85?'high':''}">${avgStrength(c.id)}</td><td>${c.reputation}</td><td>${fmtE(c.transferBudget)}</td><td>${c.stadium}</td><td>${c.capacity.toLocaleString('de-DE')}</td></tr>`).join('')}</tbody></table></div></div>`}
function sourcesHtml(){return `<div class="card full"><h1>Datenstand</h1><p>Stand: 06.10.2026 · Saison 2026/27.</p><p><b>Reale Daten:</b> Bundesliga-Vereine, aktuelle Kadernamen, aktuelle Cheftrainer, Stadien/Kapazitäten und mehrere Sportdirektoren/Führungspersonen.</p><p><b>Touchline-Spielmodell:</b> Gesamtstärken, Potenziale, Marktwerte, Gehälter, Transferbudgets, Ticketpreise und Mitarbeiterstärken. Diese Werte sind bewusst eigene Spielwerte und nicht aus EA FC oder Football Manager kopiert.</p><p class="small">* Alterswerte sind in dieser technischen Version teilweise modelliert, solange nicht für jeden Spieler ein verifizierter Geburtstag hinterlegt ist. Die Kadernamen selbst entsprechen dem aktuellen 2026/27-Stand der Bundesliga.</p></div>`}
function renderModal(){if(!modal)return'';if(modal.type==='offer'){const p=state.players.find(x=>x.id===modal.playerId),seller=club(p.clubId),ask=Math.round(p.value*(1.12+(seller.reputation-myClub().reputation)/500));const demand=Math.round(p.wage*(1.10+(myClub().reputation<seller.reputation?.08:0)));return `<div class="modalback"><div class="modal form"><button class="button secondary closeModal" style="float:right">Schließen</button><h2>${p.name}</h2><p>${seller.name} · ${p.position} · Stärke <b>${p.rating}</b> · Potenzial <b>${p.potential}</b></p><div class="notice">Geschätzte Forderung des Vereins: <b>${fmtE(ask)}</b></div><div class="formgrid"><div><label>Ablöseangebot</label><input id="fee" type="number" value="${Math.round(ask*.92)}"></div><div><label>Geplantes Gehalt/Woche</label><input id="wage" type="number" value="${demand}"></div><div><label>Vertragslaufzeit</label><select id="years"><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div><div><label>Kaderrolle</label><select id="roleOffer"><option value="rotation">Rotation</option><option value="important">Wichtiger Spieler</option><option value="star">Starspieler</option></select></div><div><label>Handgeld</label><input id="bonus" type="number" value="${Math.round(p.value*.03)}"></div></div><button class="button" id="submitClubOffer">Angebot an Verein senden</button></div></div>`}
if(modal.type==='player'){const t=state.transfers.find(x=>x.id===modal.transferId),p=state.players.find(x=>x.id===t.playerId);return `<div class="modalback"><div class="modal form"><button class="button secondary closeModal" style="float:right">Schließen</button><h2>Vertrag mit ${p.name}</h2><p>Der abgebende Verein hat ${fmtE(t.fee)} akzeptiert.</p><div class="formgrid"><div><label>Gehalt/Woche</label><input id="wage2" type="number" value="${t.wage}"></div><div><label>Laufzeit</label><select id="years2"><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div><div><label>Rolle</label><select id="role2"><option value="rotation">Rotation</option><option value="important" selected>Wichtiger Spieler</option><option value="star">Starspieler</option></select></div><div><label>Handgeld</label><input id="bonus2" type="number" value="${Math.round(p.value*.03)}"></div></div><button class="button" id="submitPlayerOffer">Vertrag anbieten</button></div></div>`}return''}

function wireView(){
 document.querySelectorAll('.negotiate').forEach(b=>b.onclick=()=>{modal={type:'offer',playerId:b.dataset.p};app()});
 document.querySelectorAll('.closeModal').forEach(b=>b.onclick=()=>{modal=null;app()});
 if(view==='transfers'){
  const search=document.getElementById('search'),min=document.getElementById('minRating'),pos=document.getElementById('pos');
  const ref=()=>{let q=(search.value||'').toLowerCase();let arr=state.players.filter(p=>p.clubId!==state.clubId&&p.rating>=+min.value&&(!pos.value||p.position===pos.value)&&p.name.toLowerCase().includes(q)).sort((a,b)=>b.rating-a.rating).slice(0,120);document.getElementById('transferTable').innerHTML=playerTable(arr,true);document.querySelectorAll('.negotiate').forEach(b=>b.onclick=()=>{modal={type:'offer',playerId:b.dataset.p};app()})};search.oninput=min.onchange=pos.onchange=ref;
 }
 if(document.getElementById('saveTicket'))document.getElementById('saveTicket').onclick=()=>{myClub().ticketPrice=+document.getElementById('ticket').value;save();app()};
 document.querySelectorAll('.playerTalk').forEach(b=>b.onclick=()=>{modal={type:'player',transferId:b.dataset.t};app()});
 if(document.getElementById('submitClubOffer'))document.getElementById('submitClubOffer').onclick=submitClubOffer;
 if(document.getElementById('submitPlayerOffer'))document.getElementById('submitPlayerOffer').onclick=submitPlayerOffer;
}
function submitClubOffer(){const p=state.players.find(x=>x.id===modal.playerId),seller=club(p.clubId),fee=+document.getElementById('fee').value,wage=+document.getElementById('wage').value,years=+document.getElementById('years').value,role=document.getElementById('roleOffer').value,bonus=+document.getElementById('bonus').value;const ask=p.value*(1.08+Math.max(0,seller.reputation-myClub().reputation)/450)*(p.contractYears>=4?1.08:1);let status='Verein lehnt ab';if(fee>=ask*.96)status='Verein akzeptiert';else if(fee>=ask*.87)status='Gegenangebot: '+fmtE(Math.round(ask));const t={id:'t'+Date.now(),playerId:p.id,playerName:p.name,fromClubId:p.clubId,toClubId:state.clubId,fee,wage,years,role,bonus,status,createdAt:new Date().toISOString()};state.transfers.push(t);save();modal=null;view='negotiations';app()}
function submitPlayerOffer(){const t=state.transfers.find(x=>x.id===modal.transferId),p=state.players.find(x=>x.id===t.playerId),wage=+document.getElementById('wage2').value,years=+document.getElementById('years2').value,role=document.getElementById('role2').value,bonus=+document.getElementById('bonus2').value;const repGap=club(p.clubId).reputation-myClub().reputation;let demand=p.wage*(1.05+Math.max(0,repGap)/170);if(role==='star')demand*=.94;if(role==='rotation')demand*=1.12;const accepted=wage>=demand*.97&&bonus>=p.value*.015;if(!accepted){t.status='Spieler lehnt Vertrag ab';t.wage=wage;t.bonus=bonus;save();modal=null;app();return}if(myClub().transferBudget<t.fee+bonus){alert('Transferbudget reicht nicht.');return}const projected=squad().reduce((a,x)=>a+x.wage,0)+wage;if(projected>myClub().wageBudget*1.08){alert('Gehaltsbudget würde zu stark überschritten.');return}const from=club(p.clubId);myClub().transferBudget-=t.fee+bonus;from.transferBudget+=t.fee;p.clubId=state.clubId;p.wage=wage;p.contractYears=years;t.status='Transfer abgeschlossen';t.wage=wage;t.years=years;t.role=role;t.bonus=bonus;state.history.push(`${p.name} für ${fmtE(t.fee)} verpflichtet`);save();modal=null;view='squad';app()}
app();

</script>
